<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Merchant&#39;s Helper</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: library of BoMs (filter bar + list) that opens into a workbench: inputs and uploads on top, editable BoM sheet below, open items last. */
:root{
  --bg:#f6f8fb; --surface:#ffffff; --ink:#18212f; --muted:#5b6678; --line:#d5dce7;
  --head:#dce9f7; --group:#eaf2fb; --accent:#1f5fa8; --accent-ink:#ffffff; --input:#0b3fd1;
  --warn-bg:#fff3b0; --warn-line:#c9a800; --bad:#b3261e;
  --est-bg:#fff2cc; --est-fg:#7a5a00; --carry-bg:#fde6d6; --carry-fg:#8a3d12; --tp-bg:#e3eefb; --tp-fg:#1f4f86;
  --ok-bg:#dff3e4; --ok-fg:#1d6b34; --total:#ffe699;
  --bar:#714b67; --bar-ink:#ffffff; --bar-soft:#f1e8ef;
  --font-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1520; --surface:#161e2c; --ink:#e6ebf3; --muted:#9aa6ba; --line:#2b3649;
  --head:#1e2e47; --group:#192539; --accent:#7db4f0; --accent-ink:#0f1520; --input:#8db8ff;
  --warn-bg:#5a4b00; --warn-line:#a88b00; --bad:#ff8a80;
  --est-bg:#4a3b0a; --est-fg:#f0cf74; --carry-bg:#4d2a17; --carry-fg:#f2b48c; --tp-bg:#1d3556; --tp-fg:#a9cdf5;
  --ok-bg:#173a24; --ok-fg:#8fd9a6; --total:#6b5810;
  --bar:#7b5571; --bar-ink:#ffffff; --bar-soft:#2b2030; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1520; --surface:#161e2c; --ink:#e6ebf3; --muted:#9aa6ba; --line:#2b3649;
  --head:#1e2e47; --group:#192539; --accent:#7db4f0; --accent-ink:#0f1520; --input:#8db8ff;
  --warn-bg:#5a4b00; --warn-line:#a88b00; --bad:#ff8a80;
  --est-bg:#4a3b0a; --est-fg:#f0cf74; --carry-bg:#4d2a17; --carry-fg:#f2b48c; --tp-bg:#1d3556; --tp-fg:#a9cdf5;
  --ok-bg:#173a24; --ok-fg:#8fd9a6; --total:#6b5810;
  --bar:#7b5571; --bar-ink:#ffffff; --bar-soft:#2b2030; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.45;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1360px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em;color:var(--accent);text-wrap:balance}
h2{font-size:15px;margin:0;font-weight:700}
.top{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
.sub{color:var(--muted);font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font-family:var(--font-body);font-size:13px;padding:7px 13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.5;cursor:not-allowed}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.danger{color:var(--bad)}
button.link{border:0;background:none;color:var(--accent);padding:2px 4px;text-decoration:underline}
input,select,textarea{font-family:var(--font-body);font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);padding:6px 8px;border-radius:3px;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
textarea{width:100%;resize:vertical;min-height:90px;line-height:1.4}
label.f{display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);min-width:0}
label.f input,label.f select{font-size:14px;letter-spacing:0;text-transform:none;font-weight:400;color:var(--ink);width:100%}
.panel{background:var(--surface);border:1px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 14px}
.banner{padding:8px 12px;border:1px solid var(--warn-line);background:var(--warn-bg);font-size:13px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 12px;align-items:end}
.tablebox{overflow-x:auto;border:1px solid var(--line);background:var(--surface)}
table{border-collapse:collapse;width:100%}
table.bom{min-width:560px}
table.lib{min-width:1200px}
th{background:var(--head);font-weight:600;font-size:12px;text-align:left;padding:8px;border:1px solid var(--line);white-space:nowrap}
td{padding:5px 8px;border:1px solid var(--line);vertical-align:top;font-size:13px}
td.n,th.n{text-align:right}
td.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
tr.grp td{background:var(--group);font-weight:700}
table.lib tbody tr{cursor:pointer}
table.lib tbody tr:hover td{background:var(--group)}
table.lib td b{font-weight:600}
table.lib small{display:block;color:var(--muted);font-size:12px}
.cell{font-family:var(--font-num);font-size:13px;text-align:right;color:var(--input);width:84px}
.cell.need{background:var(--warn-bg);border-color:var(--warn-line)}
.t{width:100%;min-width:90px;color:var(--ink)}
.t.art{min-width:340px}
.t.bas{min-width:300px;font-size:12px;color:var(--muted)}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:2px;white-space:nowrap}
.s-tp{background:var(--tp-bg);color:var(--tp-fg)}.s-est{background:var(--est-bg);color:var(--est-fg)}.s-carry{background:var(--carry-bg);color:var(--carry-fg)}.s-wfx{background:var(--ok-bg);color:var(--ok-fg)}
.st-Draft{background:var(--est-bg);color:var(--est-fg)}.st-Reviewed{background:var(--tp-bg);color:var(--tp-fg)}.st-Accepted{background:var(--ok-bg);color:var(--ok-fg)}
.pendchip{background:var(--warn-bg);color:var(--ink)}.okchip{background:var(--ok-bg);color:var(--ok-fg)}
.drop{border:2px dashed var(--line);padding:18px;text-align:center;color:var(--muted);cursor:pointer;background:var(--bg)}
.drop.over{border-color:var(--accent);background:var(--group)}
.files{display:flex;flex-wrap:wrap;gap:8px}
.file{display:flex;align-items:center;gap:8px;border:1px solid var(--line);padding:4px 8px;font-size:12px;background:var(--surface);max-width:100%}
.file img{width:44px;height:44px;object-fit:cover;border:1px solid var(--line)}
.file span{overflow-wrap:anywhere;min-width:0}
.totals{display:flex;flex-wrap:wrap;gap:10px 32px;align-items:center;justify-content:space-between;background:var(--total);padding:12px 16px;border:1px solid var(--line)}
.totals .big{font-family:var(--font-num);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.totals small{font-size:12px;opacity:.85}
.msg{font-size:13px;color:var(--muted);min-height:20px}
.msg.err{color:var(--bad)}
.flags{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:4px 24px}
.flags li{padding:8px 0;border-top:1px solid var(--line);min-width:0;display:flex;gap:8px;justify-content:space-between}
.flags b{display:block;font-size:13px}.flags span{color:var(--muted);font-size:13px}
.legend{color:var(--muted);font-size:12px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.sheet{background:var(--surface);border:1px solid var(--line);padding:22px 24px;display:flex;flex-direction:column;gap:14px}
.sh-co{display:flex;flex-direction:column;font-size:13px;line-height:1.4}
.sh-co b{font-size:15px;font-weight:600}
.sh-title{color:var(--bar);font-size:16px;font-weight:700;margin:6px 0 0}
.sh-box{border:1px solid var(--line);padding:8px 12px;display:flex;flex-direction:column;gap:2px;font-size:13px}
.sh-box>b{color:var(--bar);font-size:14px}
.sh-sec{font-size:12px;font-weight:700;letter-spacing:.05em;margin-top:4px}
.sheet th{background:var(--bar);color:var(--bar-ink);border-color:var(--bar);text-align:center;font-weight:500}
.sheet tr.tot td{background:var(--bar-soft);font-weight:700}
.sheet td.lab{text-align:right}
.sheet tr.bar td{background:var(--bar);color:var(--bar-ink);font-weight:700;border-color:var(--bar)}
.sheet table.rep{min-width:0}
.sheet .sum{align-self:flex-end;width:min(560px,100%)}
.sheet:not(.detail) .x{display:none}
.sheet.detail table.bom{min-width:1500px}
.sh-tools{gap:8px 10px}
.view{display:flex;flex-direction:column;gap:18px}
.brand{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:9px 16px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.tab:hover:not(:disabled){color:var(--ink);border-color:transparent;border-bottom-color:var(--line)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}

#lc-result{display:flex;flex-direction:column;gap:14px}
#lc-result:empty{display:none}
.lc-slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.lc-slot{border:1px solid var(--line);background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.lc-slot.have{border-color:var(--accent)}
.lc-slot h3{margin:0;font-size:13px;font-weight:700}
.lc-slot .hint{font-size:12px;color:var(--muted)}
.lc-slot input[type=file]{font-size:12px;width:100%}
.lc-verdict{padding:14px 16px;border:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.lc-verdict b{font-size:20px}
.lc-verdict.ok{background:var(--ok-bg);color:var(--ok-fg)}
.lc-verdict.check{background:var(--est-bg);color:var(--est-fg)}
.lc-verdict.hold{background:var(--carry-bg);color:var(--carry-fg)}
.lc-verdict.incomplete{background:var(--tp-bg);color:var(--tp-fg)}
.lc-find{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.lc-find li{border:1px solid var(--line);padding:8px 12px;display:flex;gap:10px;align-items:flex-start;min-width:0;background:var(--surface)}
.lc-find li>div{min-width:0;overflow-wrap:anywhere}
.lc-find small{display:block;color:var(--muted);font-size:12px}
.chip.block{background:var(--carry-bg);color:var(--carry-fg)}
.chip.chk{background:var(--est-bg);color:var(--est-fg)}
.chip.good{background:var(--ok-bg);color:var(--ok-fg)}
.chip.na{background:var(--group);color:var(--muted)}
table.lc{min-width:820px}
table.lc td.v{max-width:200px;overflow-wrap:anywhere;font-size:12px}
table.lc tr.bad td{background:var(--carry-bg)}
table.lc tr.mis td{background:var(--warn-bg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>

<div class="wrap">
  <div class="brand">Merchant&#39;s Helper</div>
  <div class="tabs" role="tablist" aria-label="Sections">
    <button type="button" role="tab" id="tab-bom" class="tab" aria-selected="true" aria-controls="app" data-tab="bom">Build BoM</button>
    <button type="button" role="tab" id="tab-lbl" class="tab" aria-selected="false" aria-controls="pane-label" data-tab="label" tabindex="-1">Label Checker</button>
  </div>
  <div id="app" class="view" role="tabpanel" aria-labelledby="tab-bom"></div>
  <div id="pane-label" class="view" role="tabpanel" aria-labelledby="tab-lbl" hidden>
    <div class="top"><div><h1>Label Checker</h1><div class="sub">Add the PO, tech pack, FPT report and the buyer portal layouts. Claude checks the wash care label and the price tag against them and says whether they can be ordered.</div></div>
      <div class="row"><button id="lc-new" type="button">Clear and start new</button></div></div>
    <div class="panel"><div class="fields">
      <label class="f">Style<input id="lc-style" type="text" autocomplete="off"></label>
      <label class="f">PO number<input id="lc-po" type="text" autocomplete="off"></label>
      <label class="f">Buyer<input id="lc-buyer" type="text" autocomplete="off" placeholder="LC Waikiki"></label>
    </div>
    <div class="lc-slots" id="lc-slots"></div>
    <label class="f">Notes for Claude (optional)<textarea id="lc-notes" placeholder="e.g. PO is for the dress only, the belt is a separate style"></textarea></label>
    <div class="row"><button id="lc-run" class="primary" type="button">Check the labels</button><button id="lc-stop" type="button" hidden>Stop</button><span class="msg" id="lc-msg" role="status"></span></div></div>
    <div id="lc-result"></div>
    <div id="lc-hist"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* Saving layer for the Vercel copy. Only runs when the Claude runtime is absent.
   It gives the page the same db / user / downloads calls it already uses, backed by Supabase. */
(function(){
  if (window.claude) return;
  var URL_ = "https://pxkhpmatpgkpknxprqsv.supabase.co";
  var KEY = "sb_publishable_WFNgGJFYy3yd3mDMpWBv1Q_kK13TtMy";   // public key, safe in the page; access is guarded by login + database rules
  var DOMAIN = "@gudi.net";
  var sb = window.supabase.createClient(URL_, KEY, {auth: {persistSession: true, autoRefreshToken: true}});
  var email = null, readyRes, ready = new Promise(function(r){ readyRes = r; });

  /* ---- login screen ---- */
  var ov = document.createElement("div");
  ov.style.cssText = "position:fixed;inset:0;z-index:9999;background:#f4f7fb;display:none;align-items:center;justify-content:center;font-family:system-ui,sans-serif;padding:16px";
  ov.innerHTML = '<form id="gl" style="background:#fff;border:1px solid #cfd8e6;border-radius:10px;padding:24px;width:100%;max-width:340px;box-shadow:0 4px 18px rgba(0,0,0,.08)">' +
    '<h2 style="margin:0 0 4px;font-size:20px;color:#1f3a5f">Merchant’s Helper</h2>' +
    '<p style="margin:0 0 16px;color:#556;font-size:13px">Sign in with your Gudi email and the password Sanjeev gave you.</p>' +
    '<input id="gl-e" type="email" placeholder="name@gudi.net" required autocomplete="username" style="width:100%;box-sizing:border-box;padding:9px;margin-bottom:8px;border:1px solid #b9c4d6;border-radius:6px;font-size:14px">' +
    '<input id="gl-p" type="password" placeholder="Password (6+ characters)" required minlength="6" autocomplete="current-password" style="width:100%;box-sizing:border-box;padding:9px;margin-bottom:12px;border:1px solid #b9c4d6;border-radius:6px;font-size:14px">' +
    '<button id="gl-in" type="submit" style="width:100%;padding:10px;background:#1f5fa8;color:#fff;border:0;border-radius:6px;font-size:14px;cursor:pointer">Sign in</button>' +
    '<div id="gl-m" style="margin-top:12px;font-size:13px;color:#b3261e;min-height:18px"></div></form>';
  function mount(){ document.body.appendChild(ov); }
  if (document.body) mount(); else document.addEventListener("DOMContentLoaded", mount);
  function msg(t, ok){ var m = ov.querySelector("#gl-m"); if (m){ m.style.color = ok ? "#1b6b3a" : "#b3261e"; m.textContent = t; } }
  function okEmail(e){ return String(e || "").toLowerCase().slice(-DOMAIN.length) === DOMAIN; }
  function accept(session){
    var e = session && session.user && session.user.email;
    if (!e) return false;
    if (!okEmail(e)){ sb.auth.signOut(); msg("Only " + DOMAIN + " emails can use this."); return false; }
    email = e; ov.style.display = "none"; readyRes(); return true;
  }
  sb.auth.getSession().then(function(r){ if (!accept(r.data && r.data.session)) ov.style.display = "flex"; });
  sb.auth.onAuthStateChange(function(ev, s){ if (ev === "SIGNED_OUT"){ email = null; ov.style.display = "flex"; } });
  ov.addEventListener("submit", function(ev){
    ev.preventDefault(); msg("");
    var e = ov.querySelector("#gl-e").value.trim(), p = ov.querySelector("#gl-p").value;
    if (!okEmail(e)){ msg("Use your " + DOMAIN + " email."); return; }
    sb.auth.signInWithPassword({email: e, password: p}).then(function(r){
      if (r.error) msg(/confirm/i.test(r.error.message) ? "Confirm your email first (check your inbox), then sign in." : "Wrong email or password.");
      else accept(r.data.session);
    });
  });
  /* ---- database calls the page already makes ---- */
  var MAP = {boms: {get: "get_boms", save: "save_bom", del: "delete_bom"}, labelChecks: {get: "get_label_checks", save: "save_label_check", del: "delete_label_check"}};
  var listeners = {boms: [], labelChecks: []};
  var busy = {};
  function fail(e){ var x = new Error((e && e.message) || "failed"); x.code = "unavailable"; return x; }
  function refresh(name){
    if (busy[name]) return busy[name];
    busy[name] = sb.rpc(MAP[name].get).then(function(r){
      if (r.error) throw fail(r.error);
      var list = r.data || [];
      var snap = {docs: list.map(function(o){ var id = o.id; return {id: id, data: function(){ return o; }}; })};
      listeners[name].forEach(function(l){ try{ l.ok(snap); }catch(e){} });
    }).catch(function(e){ listeners[name].forEach(function(l){ try{ l.err && l.err(e); }catch(x){} }); })
      .then(function(){ busy[name] = null; });
    return busy[name];
  }
  setInterval(function(){ if (email && !document.hidden) Object.keys(listeners).forEach(function(n){ if (listeners[n].length) refresh(n); }); }, 30000);
  document.addEventListener("visibilitychange", function(){ if (email && !document.hidden) Object.keys(listeners).forEach(function(n){ if (listeners[n].length) refresh(n); }); });

  var db = {
    collection: function(name){ return {onSnapshot: function(ok, err){ listeners[name].push({ok: ok, err: err}); refresh(name); return function(){}; }}; },
    doc: function(path){
      var parts = path.split("/"), name = parts[0], id = parts[1];
      return {
        set: function(body){
          var p = JSON.parse(JSON.stringify(body)); p.id = id;
          return sb.rpc(MAP[name].save, {p: p}).then(function(r){ if (r.error) throw fail(r.error); return refresh(name); });
        },
        delete: function(){
          return sb.rpc(MAP[name].del, {p_id: id}).then(function(r){ if (r.error) throw fail(r.error); return refresh(name); });
        }
      };
    }
  };
  var user = {
    id: function(){ return Promise.resolve(email); },
    can: function(){ return Promise.resolve(true); },
    profiles: function(ids){ var o = {}; (ids || []).forEach(function(i){ o[i] = {name: String(i).split("@")[0]}; }); return Promise.resolve(o); }
  };
  var downloads = {
    save: function(o){
      var data = o.data, type = o.mimeType || (/\.pdf$/i.test(o.filename) ? "application/pdf" : /\.csv$/i.test(o.filename) ? "text/csv" : "application/octet-stream");
      var url = URL.createObjectURL(new Blob([data], {type: type}));
      var a = document.createElement("a"); a.href = url; a.download = o.filename; document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1000);
      return Promise.resolve();
    }
  };

  /* ---- Claude, through the site's own /api/claude (the key stays on the server) ---- */
  function token(){ return sb.auth.getSession().then(function(r){ return r.data && r.data.session ? r.data.session.access_token : ""; }); }
  function shrink(blob){
    return createImageBitmap(blob).then(function(bm){
      var sc = Math.min(1, 1400 / Math.max(bm.width, bm.height)), c = document.createElement("canvas");
      c.width = Math.round(bm.width * sc); c.height = Math.round(bm.height * sc);
      var x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(bm, 0, 0, c.width, c.height);
      return new Promise(function(ok){ c.toBlob(function(b){ var fr = new FileReader(); fr.onload = function(){ ok({type: "image/jpeg", data: String(fr.result).split(",")[1]}); }; fr.readAsDataURL(b); }, "image/jpeg", 0.8); });
    });
  }
  var sample = {
    limits: function(){ return Promise.resolve({images: {maxCount: 8}}); },
    json: function(prompt, o){
      o = o || {};
      return Promise.all([token(), Promise.all((o.images || []).map(shrink))]).then(function(a){
        return fetch("/api/claude", {method: "POST", signal: o.signal, headers: {"content-type": "application/json", authorization: "Bearer " + a[0]}, body: JSON.stringify({prompt: prompt, images: a[1]})});
      }).then(function(r){
        return r.json().catch(function(){ return {}; }).then(function(j){
          if (!r.ok || !j.data){
            console.error("Claude call failed", r.status, j);
            var e = new Error(j.error || "failed");
            e.code = j.error === "invalid_json" ? "invalid_json" : r.status === 401 ? "session_expired" : r.status === 413 ? "prompt_too_large" : r.status === 429 ? "rate_limited" : j.error === "bad_key" ? "sampling_disabled" : "unavailable";
            throw e;
          }
          return j.data;
        });
      });
    }
  };

function serialize(b){

  o.prod = prodList(b).map(function(p){ return {name: String(p.name || ""), amount: (p.amount === null || p.amount === undefined || p.amount === "") ? null : num(p.amount)}; });
  o.indirect = b.indirect.map(function(x){ return {name: x.name, kind: x.kind, budget: num(x.budget)}; });
  o.profit = (b.profit === null || b.profit === undefined || b.profit === "") ? null : num(b.profit);
  o.rows = b.rows.map(function(r){ return {group: r.group, article: r.article || "", body: r.body || "", color: r.color || "", size: r.size || "", uom: r.uom || "", cons: num(r.cons), wastage: num(r.wastage), rate: hasRate(r) ? num(r.rate) : null, status: r.status || "est", basis: r.basis || ""}; });
  o.flags = b.flags.map(function(f){ return {item: f.item || "", note: f.note || ""}; });
  o.files = b.files.map(function(f){ return {id: f.id, url: f.url, name: f.name, type: f.type, size: f.size}; });
  o.techText = String(b.techText || "").slice(0, 40000);
  return o;
}

  h += '<div class="panel"><h2>Side by side</h2><div class="tablebox"><table class="lc"><thead><tr><th>Field</th>' + LC_SLOTS.map(function(s){ return '<th>' + esc(s.full) + '</th>'; }).join("") + '<th>Result</th></tr></thead><tbody>' +
    res.fields.map(function(r){

      return '<tr class="' + cls + '"><td><b>' + esc(r.field) + '</b></td>' + LC_SLOTS.map(function(s){ return '<td class="v">' + (esc(r.values[s.k]) || '<span class="sub">-</span>') + '</td>'; }).join("") + '<td>' + chip + (r.note ? '<small class="sub" style="display:block">' + esc(r.note) + '</small>' : '') + '</td></tr>';
    }).join("") + '</tbody></table></div></div>';
  if (res.fpt.length){
    h += '<div class="panel"><h2>FPT tests</h2><div class="tablebox"><table class="lc" style="min-width:0"><thead><tr><th>Test</th><th>Result</th><th>Detail</th></tr></thead><tbody>' +
      res.fpt.map(function(t){ return '<tr><td>' + esc(t.name) + '</td><td>' + (t.result === "pass" ? '<span class="chip good">Pass</span>' : t.result === "fail" ? '<span class="chip block">Fail</span>' : '<span class="chip chk">Not evaluated</span>') + '</td><td>' + esc(t.detail) + '</td></tr>'; }).join("") + '</tbody></table></div></div>';
  }

  h += '<div class="row"><button id="lc-pdf" type="button" class="primary">Download PDF report</button><button id="lc-csv" type="button">Export result (CSV)</button><span class="msg" id="lc-savemsg"></span></div>';

function lcCsv(){
  var r = lc.res; if (!r || !downloads) return;

  L.push(""); L.push("LABELS"); L.push("Label,Order,Reason");
  r.labels.forEach(function(l){ L.push([l.label, l.verdict === "order" ? "Order" : "Hold", l.reason].map(csvEsc).join(",")); });
  L.push(""); L.push("FINDINGS"); L.push("Severity,Item,Note,Documents");
  r.findings.forEach(function(f){ L.push([f.severity === "block" ? "Stops order" : "Check", f.item, f.note, (f.docs || []).join(" / ")].map(csvEsc).join(",")); });
  L.push(""); L.push("SIDE BY SIDE"); L.push(["Field"].concat(LC_SLOTS.map(function(s){ return s.full; }), ["Result", "Note"]).map(csvEsc).join(","));
  r.fields.forEach(function(x){ L.push([x.field].concat(LC_SLOTS.map(function(s){ return x.values[s.k]; }), [x.result, x.note]).map(csvEsc).join(",")); });
  L.push(""); L.push("FPT TESTS"); L.push("Test,Result,Detail");
  r.fpt.forEach(function(t){ L.push([t.name, t.result, t.detail].map(csvEsc).join(",")); });
  var name = safeName((r.ctx.style || "style") + "_" + (r.ctx.po || "PO")) + "_label_check.csv";
  downloads.save({filename: name, data: "﻿" + L.join("\r\n"), mimeType: "text/csv"}).then(function(){ var m = $("#lc-savemsg"); if (m) m.textContent = "Saved " + name; },
    function(e){ var m = $("#lc-savemsg"); if (m) m.textContent = (e && e.code === "declined") ? "Download cancelled." : "Could not save the file."; });
}


function lcMakePdf(r){
  var doc = new window.jspdf.jsPDF({unit: "mm", format: "a4", orientation: "landscape"});
  var W = 297, H = 210, M = 12, U = W - 2 * M;
  var PLUM = [113, 75, 103], INK = [30, 30, 30], LINE = [200, 200, 200];
  var table = function(o){ if (doc.autoTable) doc.autoTable(o); else window.jspdf.autoTable(doc, o); };
  var base = {theme: "grid", margin: {left: M, right: M, bottom: 14}, styles: {font: "helvetica", fontSize: 8, cellPadding: 1.6, lineColor: LINE, lineWidth: 0.1, textColor: INK, overflow: "linebreak", valign: "top"},
    headStyles: {fillColor: PLUM, textColor: 255, fontStyle: "normal"}};
  var y = 14;
  doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor.apply(doc, INK); doc.text("GUDI EXPORTS PRIVATE LIMITED", M, y);
  doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.text("Label Check Report", W - M, y, {align: "right"});
  y += 9; doc.setFont("helvetica", "bold"); doc.setFontSize(14); doc.setTextColor.apply(doc, PLUM);
  doc.text("Label and tag order check - " + (r.ctx.style || "style not given"), M, y);
  y += 6; doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor.apply(doc, INK);
  doc.text("PO: " + (r.ctx.po || "-") + "    Buyer: " + (r.ctx.buyer || "-") + "    Checked on: " + (fmtDate(r.checkedAt || nowIso()) || "-"), M, y);
  y += 5;
  var docsLine = LC_SLOTS.map(function(sl){ var f = (r.docs && r.docs[sl.k]) || []; return sl.full + ": " + (f.length ? f.join(", ") : "not supplied"); }).join("   |   ");
  var dl = doc.splitTextToSize("Documents checked - " + docsLine, U); doc.setFontSize(8); doc.text(dl, M, y); y += dl.length * 3.8 + 3;
  var v = LC_VERDICT[r.verdict] || LC_VERDICT.check;
  var VC = {ok: [214, 238, 221], check: [252, 240, 200], hold: [248, 214, 200], incomplete: [214, 226, 245]}[r.verdict] || [240, 240, 240];
  doc.setFillColor.apply(doc, VC); doc.setDrawColor.apply(doc, LINE); doc.rect(M, y, U, 15, "FD");
  doc.setFont("helvetica", "bold"); doc.setFontSize(13); doc.setTextColor.apply(doc, INK); doc.text(v.t, M + 4, y + 6.5);
  doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.text(v.d, M + 4, y + 11.5);
  y += 20;
  if (r.missing && r.missing.length){ doc.setFontSize(8.5); doc.setTextColor(150, 60, 40); doc.text("Not supplied: " + r.missing.join(", ") + ".", M, y); doc.setTextColor.apply(doc, INK); y += 6; }
  var head = function(t){ if (y > H - 40){ doc.addPage(); y = 14; } doc.setFont("helvetica", "bold"); doc.setFontSize(10); doc.setTextColor.apply(doc, PLUM); doc.text(t, M, y); y += 2; };
  var after = function(){ y = doc.lastAutoTable.finalY + 7; };
  var DOCNAME = function(k){ var q = LC_SLOTS.filter(function(z){ return z.k === k; })[0]; return q ? q.full : k; };

  head("1. Each label: order or hold");
  table(Object.assign({}, base, {startY: y, head: [["Label", "Decision", "Reason"]],
    body: r.labels.length ? r.labels.map(function(l){ return [l.label, l.verdict === "order" ? "ORDER" : "HOLD", l.reason]; }) : [["No labels listed", "", ""]],
    columnStyles: {0: {cellWidth: 70, fontStyle: "bold"}, 1: {cellWidth: 25, fontStyle: "bold"}},
    didParseCell: function(d){ if (d.section === "body" && d.column.index === 1){ d.cell.styles.textColor = d.cell.raw === "ORDER" ? [30, 110, 60] : [170, 50, 30]; } }}));
  after();

  head("2. Actions to take before ordering (" + r.findings.length + ")");
  table(Object.assign({}, base, {startY: y, head: [["#", "Level", "Issue", "What is wrong / what to confirm", "Documents"]],
    body: r.findings.length ? r.findings.map(function(f, i){ return [String(i + 1), f.severity === "block" ? "STOPS ORDER" : "Check", f.item, f.note, (f.docs || []).map(DOCNAME).join(", ")]; }) : [["", "", "Nothing found", "", ""]],
    columnStyles: {0: {cellWidth: 8}, 1: {cellWidth: 26, fontStyle: "bold"}, 2: {cellWidth: 60, fontStyle: "bold"}, 4: {cellWidth: 45}},
    didParseCell: function(d){ if (d.section === "body" && d.column.index === 1 && d.cell.raw === "STOPS ORDER") d.cell.styles.textColor = [170, 50, 30]; }}));
  after();

  head("3. Side by side: what each document says");
  var cw = Math.floor((U - 34 - 24) / 5);
  table(Object.assign({}, base, {startY: y, styles: Object.assign({}, base.styles, {fontSize: 7.5}),
    head: [["Field"].concat(LC_SLOTS.map(function(sl){ return sl.full; }), ["Result"])],
    body: r.fields.map(function(x){ return [x.field].concat(LC_SLOTS.map(function(sl){ return x.values[sl.k] || "-"; }), [({match: "Match", mismatch: "MISMATCH", missing: "Missing", na: "n/a"})[x.result] + (x.note ? "\n" + x.note : "")]); }),
    columnStyles: {0: {cellWidth: 34, fontStyle: "bold"}, 6: {cellWidth: 24 + 6}},
    didParseCell: function(d){
      if (d.section !== "body") return;
      var res = r.fields[d.row.index].result;
      if (res === "mismatch") d.cell.styles.fillColor = [250, 226, 214]; else if (res === "missing") d.cell.styles.fillColor = [253, 246, 214];
      if (d.column.index === 6 && res === "mismatch") d.cell.styles.fontStyle = "bold";
    }}));
  after();

  if (r.fpt.length){
    head("4. FPT test results");
    table(Object.assign({}, base, {startY: y, head: [["Test", "Result", "Detail"]],
      body: r.fpt.map(function(t){ return [t.name, ({pass: "Pass", fail: "FAIL"})[t.result] || "Not evaluated", t.detail]; }),
      columnStyles: {0: {cellWidth: 70}, 1: {cellWidth: 30, fontStyle: "bold"}},
      didParseCell: function(d){ if (d.section === "body" && d.column.index === 1 && d.cell.raw === "FAIL") d.cell.styles.textColor = [170, 50, 30]; }}));
    after();
  }
  if (r.unread && r.unread.length){ head("Reading notes"); doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor.apply(doc, INK); var t = doc.splitTextToSize(r.unread.join("  "), U); doc.text(t, M, y + 3); y += t.length * 3.8 + 6; }
  if (r.ctx.notes){ head("Merchandiser's notes"); doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor.apply(doc, INK); var tn = doc.splitTextToSize(r.ctx.notes, U); doc.text(tn, M, y + 3); y += tn.length * 3.8 + 6; }
  doc.setFont("helvetica", "italic"); doc.setFontSize(7.5); doc.setTextColor(120, 120, 120);
  if (y > H - 22){ doc.addPage(); y = 14; }
  doc.text("Read by Claude from the documents supplied. Confirm the points above against the original documents before placing the order.", M, y + 2);
  var n = doc.getNumberOfPages();
  for (var i = 1; i <= n; i++){ doc.setPage(i); doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(130, 130, 130); doc.text("Page " + i + " / " + n, W - M, H - 6, {align: "right"}); }
  return doc;
}
async function lcPdf(){
  var r = lc.res, m = $("#lc-savemsg"), btn = $("#lc-pdf");
  if (!r) return;
  if (!downloads){ m.className = "msg"; m.textContent = "Download is not available in this view."; return; }
  btn.disabled = true; m.className = "msg"; m.textContent = "Preparing PDF...";
  try{
    await loadPdfLib();
    var doc = lcMakePdf(r);
    var name = safeName((r.ctx.style || "style") + "_" + (r.ctx.po || "PO")) + "_Label_Check_Report.pdf";
    await downloads.save({filename: name, data: doc.output("arraybuffer")});
    m.textContent = "Saved " + name;
  }catch(e){
    m.className = "msg err";
    m.textContent = (e && e.code === "declined") ? "Download cancelled." : "Could not make the PDF. Check your connection and try again.";
  }finally{ btn.disabled = false; }
}

/* saved checks */
function lcListen(){
  db.collection("labelChecks").onSnapshot(function(snap){
    lcRecs.clear();
    snap.docs.forEach(function(d){ var raw = d.data(); if (!raw) return; var o = JSON.parse(JSON.stringify(raw)); o.id = d.id; lcRecs.set(d.id, o); });
    lcRenderHist();
  }, function(){ lcRenderHist(); });
}
function lcSave(){
  if (!db || !canWrite || !lc.res) return Promise.resolve();
  var r = lc.res, id = lc.resId || ("lc" + uid());
  lc.resId = id;
  var body = {style: r.ctx.style || "", po: r.ctx.po || "", buyer: r.ctx.buyer || "", notes: r.ctx.notes || "", verdict: r.verdict, created: nowIso(), createdBy: myId,
    blocks: r.findings.filter(function(f){ return f.severity === "block"; }).length, checks: r.findings.filter(function(f){ return f.severity !== "block"; }).length,
    missing: r.missing || [], unread: r.unread || [], docs: r.docs || {},
    result: {fields: r.fields, findings: r.findings, labels: r.labels, fpt: r.fpt}};

function lcRenderHist(){

    if (vf && x.verdict !== vf) return false;
    if (q && (x.style + " " + x.po + " " + x.buyer).toLowerCase().indexOf(q) < 0) return false;
    return true;
  }).sort(function(a, b){ return String(b.created).localeCompare(String(a.created)); });
  var h = '<div class="panel"><h2>Earlier checks (' + lcRecs.size + ')</h2><div class="filters">' +
    '<label class="f">Search style, PO or buyer<input id="lc-q" type="search" value="' + esc(lcFilter.q) + '"></label>' +
    '<label class="f">Verdict<select id="lc-fv"><option value="">All</option>' + Object.keys(LC_VERDICT).map(function(k){ return '<option value="' + k + '"' + (vf === k ? " selected" : "") + '>' + esc(LC_VERDICT[k].t) + '</option>'; }).join("") + '</select></label></div>' +
    '<div class="tablebox"><table class="lib" style="min-width:640px"><thead><tr><th>Style</th><th>PO</th><th>Buyer</th><th>Verdict</th><th class="n">Stops</th><th class="n">Checks</th><th>Checked</th><th></th></tr></thead><tbody>' +
    (rows.length ? rows.map(function(x){
      var cls = {ok: "good", check: "chk", hold: "block", incomplete: "na"}[x.verdict] || "na";
      return '<tr data-lcopen="' + esc(x.id) + '"><td><b>' + esc(x.style) + '</b></td><td>' + esc(x.po) + '</td><td>' + esc(x.buyer) + '</td><td><span class="chip ' + cls + '">' + esc((LC_VERDICT[x.verdict] || {}).t || x.verdict) + '</span></td><td class="n">' + (x.blocks || 0) + '</td><td class="n">' + (x.checks || 0) + '</td><td>' + esc(fmtDate(x.created)) + (x.createdBy ? '<small>' + esc(who(x.createdBy)) + '</small>' : '') + '</td><td><button type="button" class="link danger" data-lcdel="' + esc(x.id) + '">' + (lcDelArm === x.id ? "Press again to delete" : "Delete") + '</button></td></tr>';
    }).join("") : '<tr><td colspan="8" class="empty">' + (lcRecs.size ? "No checks match the filters." : "No saved checks yet. Each check you run is saved here.") + '</td></tr>') + '</tbody></table></div></div>';
  var keep = document.activeElement && document.activeElement.id;

  if (keep === "lc-q"){ var el = $("#lc-q"); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}
function lcOpen(id){
  var x = lcRecs.get(id); if (!x) return;
  $("#lc-style").value = x.style || ""; $("#lc-po").value = x.po || ""; $("#lc-buyer").value = x.buyer || ""; $("#lc-notes").value = x.notes || "";
  Object.keys(lc.docs).forEach(function(k){ lc.docs[k] = []; }); lcRenderSlots();
  var r = x.result || {};
  lc.res = {fields: r.fields || [], findings: r.findings || [], labels: r.labels || [], fpt: r.fpt || [], verdict: x.verdict, missing: x.missing || [], unread: x.unread || [], docs: x.docs || {},
    checkedAt: x.created, ctx: {style: x.style, po: x.po, buyer: x.buyer, notes: x.notes}};

(function lcInit(){
  lcRenderSlots(); lcRenderHist();
  var pane = $("#pane-label");
  pane.addEventListener("change", function(e){
    var t = e.target;
    if (t.matches && t.matches("[data-lcfile]")){ var k = t.getAttribute("data-lcfile"), fl = t.files; lcAddFiles(k, fl).then(function(){ }); }
    if (t.id === "lc-fv"){ lcFilter.v = t.value; lcRenderHist(); }
  });
  pane.addEventListener("input", function(e){ if (e.target.id === "lc-q"){ lcFilter.q = e.target.value; lcRenderHist(); } });
  pane.addEventListener("click", function(e){
    var t = e.target;
    var rm = t.closest("[data-lcrm]");
    if (rm){ var p = rm.getAttribute("data-lcrm").split(":"); lc.docs[p[0]].splice(parseInt(p[1], 10), 1); lcRenderSlots(); return; }
    var dl = t.closest("[data-lcdel]");
    if (dl){
      var id = dl.getAttribute("data-lcdel");
      if (lcDelArm !== id){ lcDelArm = id; lcRenderHist(); setTimeout(function(){ if (lcDelArm === id){ lcDelArm = null; lcRenderHist(); } }, 4000); return; }
      lcDelArm = null; if (lc.resId === id) lc.resId = null;
      if (db) db.doc("labelChecks/" + id).delete().catch(function(){}); return;
    }
    var op = t.closest("[data-lcopen]"); if (op){ lcOpen(op.getAttribute("data-lcopen")); return; }
    if (t.id === "lc-run") lcRun();
    else if (t.id === "lc-stop"){ if (lc.ctl) lc.ctl.abort(); }
    else if (t.id === "lc-csv") lcCsv();
    else if (t.id === "lc-pdf") lcPdf();
    else if (t.id === "lc-new"){
      if (lc.busy) return;
      Object.keys(lc.docs).forEach(function(k){ lc.docs[k] = []; }); lc.res = null; lc.resId = null;
      ["lc-style","lc-po","lc-buyer","lc-notes"].forEach(function(i){ $("#" + i).value = ""; });
      lcRenderSlots(); lcShow(); lcMsg("");
    }
  });
})();

<script>
/* Per-person access for the Vercel copy: who they are, which tabs and buyers they have, and the Users page for admins. */
(function(){
  var M = window.__merch; if (!M) return;
  var acc = null;
  function el(tag, attrs, html){ var e = document.createElement(tag); Object.keys(attrs || {}).forEach(function(k){ e.setAttribute(k, attrs[k]); }); if (html != null) e.innerHTML = html; return e; }
  function esc2(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function lower(a){ return (a || []).map(function(x){ return String(x).trim().toLowerCase(); }); }

  function noAccess(email){
    var o = el("div", {style: "position:fixed;inset:0;z-index:9998;background:var(--bg,#f4f7fb);display:flex;align-items:center;justify-content:center;padding:16px;font-family:system-ui,sans-serif"},
      '<div style="background:#fff;border:1px solid #cfd8e6;border-radius:10px;padding:24px;max-width:380px"><h2 style="margin:0 0 8px;font-size:18px;color:#1f3a5f">No access yet</h2>' +
      '<p style="margin:0 0 14px;color:#445;font-size:14px">' + esc2(email || "This account") + ' has not been given access to Merchant’s Helper. Ask Sanjeev to add you, then sign in again.</p>' +
      '<button id="na-out" type="button" style="padding:9px 14px;background:#1f5fa8;color:#fff;border:0;border-radius:6px;cursor:pointer">Sign out</button></div>');
    document.body.appendChild(o);
    o.querySelector("#na-out").onclick = M.signOut;
  }

  function header(){
    var b = document.querySelector(".brand"); if (!b) return;
    var chip = el("span", {style: "float:right;font-size:12px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--muted,#556)"},
      esc2(acc.name || acc.email) + (acc.isAdmin ? " (admin)" : "") + ' · <a href="#" id="mh-out">Sign out</a>');
    b.appendChild(chip);
    chip.querySelector("#mh-out").onclick = function(e){ e.preventDefault(); M.signOut(); };
  }

  function tabs(){
    var allowed = acc.isAdmin ? ["bom", "label"] : (acc.tabs || []);

    window.TABS.slice().forEach(function(t){
      var btn = document.getElementById(t.tab);
      if (allowed.indexOf(t.key) < 0){
        btn.hidden = true;
        document.getElementById(t.pane).hidden = true;

      } else if (!first) first = t.key;
    });
    return first;
  }

  /* buyers: one buyer is filled in and locked; several are offered as a list; anything else is cleared */
  function buyerFields(){
    if (acc.isAdmin) return;
    var list = acc.buyers || [], ok = lower(list);
    var dl = document.getElementById("mh-buyers");
    if (!dl){ dl = el("datalist", {id: "mh-buyers"}); document.body.appendChild(dl); }
    dl.innerHTML = list.map(function(b){ return '<option value="' + esc2(b) + '">'; }).join("");
    function fire(e){ e.dispatchEvent(new Event("input", {bubbles: true})); }
    function fix(e){
      if (!e) return;
      e.setAttribute("list", "mh-buyers");
      if (!list.length){ e.readOnly = true; e.placeholder = "No buyer assigned, ask Sanjeev"; if (e.value){ e.value = ""; fire(e); } return; }
      if (list.length === 1){ e.readOnly = true; if (e.value !== list[0]){ e.value = list[0]; fire(e); } return; }

      if (!e.__mh){ e.__mh = 1; e.addEventListener("change", function(){ if (e.value && ok.indexOf(e.value.trim().toLowerCase()) < 0){ e.value = ""; fire(e); e.placeholder = "Only: " + list.join(", "); } else if (e.value){ var i = ok.indexOf(e.value.trim().toLowerCase()); if (list[i] !== e.value){ e.value = list[i]; fire(e); } } }); }
    }
    function apply(){ fix(document.querySelector('#app input[data-f="buyer"]')); fix(document.getElementById("lc-buyer")); }
    new MutationObserver(apply).observe(document.querySelector(".wrap"), {childList: true, subtree: true});
    var nb = document.getElementById("lc-new"); if (nb) nb.addEventListener("click", function(){ setTimeout(apply, 0); });
    apply();
  }

  /* Users page (admins only) */
  function usersTab(){
    var bar = document.querySelector(".tabs");
    var btn = el("button", {type: "button", role: "tab", id: "tab-users", "class": "tab", "aria-selected": "false", "aria-controls": "pane-users", "data-tab": "users", tabindex: "-1"}, "Users");
    bar.appendChild(btn);
    var pane = el("div", {id: "pane-users", "class": "view", role: "tabpanel", hidden: ""});
    pane.innerHTML =
      '<div class="top"><div><h1>Users</h1><div class="sub">Give each merchant their buyers and tabs. They see and create BoMs only for their own buyers, and only their own BoMs. Set a password here and give it to the person. No sign-up needed.</div></div></div>' +
      '<div class="panel"><div class="fields">' +
      '<label class="f">Email<input id="u-email" type="email" placeholder="name@gudi.net" autocomplete="off"></label>' +
      '<label class="f">Name<input id="u-name" type="text" autocomplete="off"></label>' +
      '<label class="f">Buyers (comma separated)<input id="u-buyers" type="text" placeholder="OUI, LCW" autocomplete="off"></label>' +
      '<label class="f">Password (8+ characters, leave empty to keep as is)<span style="display:flex;gap:6px"><input id="u-pass" type="text" autocomplete="off" style="flex:1"><button id="u-gen" type="button">Generate</button></span></label></div>' +
      '<div class="row" style="gap:16px;flex-wrap:wrap;margin-top:8px">' +
      '<label style="display:flex;gap:6px;align-items:center"><input id="u-bom" type="checkbox" checked> Build BoM tab</label>' +
      '<label style="display:flex;gap:6px;align-items:center"><input id="u-label" type="checkbox" checked> Label Checker tab</label>' +
      '<label style="display:flex;gap:6px;align-items:center"><input id="u-admin" type="checkbox"> Admin (sees everything, manages users)</label>' +
      '<label style="display:flex;gap:6px;align-items:center"><input id="u-active" type="checkbox" checked> Active</label></div>' +
      '<div class="row" style="margin-top:10px"><button id="u-save" class="primary" type="button">Save user</button><button id="u-clear" type="button">Clear</button><span class="msg" id="u-msg" role="status"></span></div></div>' +
      '<div class="panel"><div id="u-list"></div></div>';
    bar.parentNode.appendChild(pane);
    window.TABS.push({key: "users", tab: "tab-users", pane: "pane-users"});
    var users = [], armed = "";
    function msg(t, bad){ var m = pane.querySelector("#u-msg"); m.className = bad ? "msg err" : "msg"; m.textContent = t; }
    function $u(i){ return pane.querySelector("#" + i); }
    function clear(){ ["u-email","u-name","u-buyers","u-pass"].forEach(function(i){ $u(i).value = ""; }); $u("u-email").readOnly = false; $u("u-bom").checked = $u("u-label").checked = $u("u-active").checked = true; $u("u-admin").checked = false; }
    function draw(){
      $u("u-list").innerHTML = '<table><thead><tr><th>Person</th><th>Buyers</th><th>Tabs</th><th class="n">BoMs</th><th>Status</th><th></th></tr></thead><tbody>' +
        users.map(function(u){
          return '<tr data-edit="' + esc2(u.email) + '" style="cursor:pointer"><td><b>' + esc2(u.name || u.email.split("@")[0]) + '</b><br><small>' + esc2(u.email) + '</small></td>' +
            '<td>' + (u.isAdmin ? "All" : esc2((u.buyers || []).join(", ")) || "<i>none</i>") + '</td>' +
            '<td>' + (u.isAdmin ? "All + Users" : esc2((u.tabs || []).map(function(t){ return t === "bom" ? "Build BoM" : "Label Checker"; }).join(", ")) || "<i>none</i>") + '</td>' +
            '<td class="n">' + (u.bomCount || 0) + '</td><td>' + (u.active ? "Active" : "Off") + '</td>' +
            '<td>' + (u.email === acc.email ? "" : '<button type="button" class="link danger" data-del="' + esc2(u.email) + '">' + (armed === u.email ? "Press again to delete" : "Delete") + '</button>') + '</td></tr>';
        }).join("") + '</tbody></table>';
    }
    function load(){ return M.rpc("admin_list_users").then(function(r){ users = r || []; draw(); }, function(e){ msg("Could not load users: " + e.message, true); }); }
    pane.addEventListener("click", function(ev){
      var d = ev.target.closest("[data-del]");
      if (d){ ev.stopPropagation(); var em = d.getAttribute("data-del");
        if (armed !== em){ armed = em; draw(); return; }
        armed = ""; M.rpc("admin_delete_user", {p_email: em}).then(function(){ msg("Deleted " + em + "."); return load(); }, function(e){ msg(e.message, true); }); return; }
      var r = ev.target.closest("[data-edit]");
      if (r){ var u = users.filter(function(x){ return x.email === r.getAttribute("data-edit"); })[0]; if (!u) return;
        $u("u-email").value = u.email; $u("u-email").readOnly = true; $u("u-name").value = u.name || ""; $u("u-buyers").value = (u.buyers || []).join(", ");
        $u("u-bom").checked = (u.tabs || []).indexOf("bom") >= 0; $u("u-label").checked = (u.tabs || []).indexOf("label") >= 0; $u("u-admin").checked = !!u.isAdmin; $u("u-active").checked = !!u.active;
        msg("Editing " + u.email + ". Change what you need and press Save user."); window.scrollTo(0, 0); }
    });
    $u("u-gen").onclick = function(){ var c = "abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ23456789", a = new Uint32Array(10), p = ""; crypto.getRandomValues(a); for (var i = 0; i < a.length; i++) p += c[a[i] % c.length]; $u("u-pass").value = p; };
    $u("u-clear").onclick = function(){ clear(); msg(""); };
    $u("u-save").onclick = function(){
      var em = $u("u-email").value.trim().toLowerCase();
      if (!/@gudi\.net$/.test(em)){ msg("Use a @gudi.net email.", true); return; }
      var t = []; if ($u("u-bom").checked) t.push("bom"); if ($u("u-label").checked) t.push("label");
      var b = $u("u-buyers").value.split(",").map(function(x){ return x.trim(); }).filter(Boolean);
      var admin = $u("u-admin").checked;
      if (!admin && !b.length && t.indexOf("bom") >= 0 && !confirm("No buyers entered. This person will not be able to enter a buyer on any BoM. Save anyway?")){ return; }
      msg("Saving...");
      M.rpc("admin_save_user", {p: {email: em, name: $u("u-name").value.trim(), buyers: b, tabs: t, isAdmin: admin, active: $u("u-active").checked}})
        .then(function(){
          var pw = $u("u-pass").value;
          if (!pw) return null;
          if (pw.length < 8) throw new Error("Password needs 8 or more characters.");
          return M.token().then(function(t){ return fetch("/api/admin-user", {method: "POST", headers: {"content-type": "application/json", authorization: "Bearer " + t}, body: JSON.stringify({email: em, password: pw})}); })
            .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){
              if (!r.ok){ throw new Error(j.error === "not_configured" ? "Passwords are not set up yet. The user was saved, but add SUPABASE_SERVICE_ROLE_KEY in Vercel." : "Could not set the password (" + (j.error || r.status) + ").") ; }
              return pw; }); });
        })
        .then(function(pw){ msg(pw ? "Saved " + em + ". Login: " + em + " / " + pw + "  (copy it now, it is not shown again)." : "Saved " + em + "."); if (!pw) clear(); else { $u("u-pass").value = ""; $u("u-email").readOnly = false; } return load(); }, function(e){ msg(e.message, true); });
    };
    load();
    btn.addEventListener("click", load);
  }

  M.access().then(function(a){
    if (!a){ noAccess(M.email()); return; }
    acc = a;
    header();
    var first = tabs();
    if (acc.isAdmin) usersTab();
    buyerFields();
    if (first) window.showTab(first);
    else if (acc.isAdmin) window.showTab("users");
    else noAccess(acc.email);
  });
})();
</script>

</body></html>
